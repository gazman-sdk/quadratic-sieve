plugins {
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.gazman.Main'
    // Ensure *run* uses UTF-8 even if IntelliJ delegates to Gradle:
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8']
}

// Compile/source encoding
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Resources (if you have non-ASCII in resource files)
tasks.named('processResources') {
    // available on recent Gradle; falls back to default when not filtering
    // but still sets the charset where applicable
    filteringCharset = 'UTF-8'
}

// Any JavaExec (including `run`) — belt-and-suspenders
tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
    jvmArgs += ['-Xms128m', '-Xmx1g']
}

// Tests
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
    jvmArgs += ['-Xms128m', '-Xmx1g']
    useJUnit()
}
